openapi: "3.0.3"
info:
  title: VDS Provider Grabber API
  version: "1.0.0"
  description: >-
    Catalogue of VDS hosting providers, their locations, tariffs and price history.
    This document is hand-written (see ADR-07: vds-001-adr-07-openapi-handwritten-vs-ktor-generated)
    and served verbatim from the classpath at GET /openapi.yaml; it is kept honest by
    OpenApiContractTest, which fails if the operation set here drifts from the routes the
    application actually registers. Money and FX-rate values, and geographic coordinates, are
    always JSON strings in plain decimal notation, never JSON numbers. Timestamps must carry an
    explicit offset on input and are always returned in UTC with a trailing Z at whole-second
    precision. A field documented as optional is omitted from the response entirely when it has
    no value (the shared Json runs with explicitNulls = false) -- it is never sent as JSON null.
tags:
  - name: Ops
  - name: Auth
  - name: Providers
  - name: Locations
  - name: Tariffs
  - name: Prices
  - name: Admin
  - name: Dictionaries
  - name: Meta
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Ops]
      summary: Liveness probe
      description: "No authentication required. Never touches the database -- process liveness only."
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /health/ready:
    get:
      tags: [Ops]
      summary: Readiness probe
      description: >-
        No authentication required. Runs a bounded SELECT 1 against the database. Note: the 503
        response below does NOT use the shared error envelope (ApiError) -- it is answered
        directly by the handler with a different, narrower body shape.
      security: []
      responses:
        "200":
          description: The database answered within the bound.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: The database did not answer within the bound. Body is NOT the shared ApiError envelope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessFailureResponse" }

  /version:
    get:
      tags: [Ops]
      summary: Build version
      description: "No authentication required."
      security: []
      responses:
        "200":
          description: Version and build timestamp read from the packaged version.properties.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionResponse" }

  /openapi.yaml:
    get:
      tags: [Meta]
      summary: This contract document
      description: >-
        Required role: VIEWER (any authenticated role suffices -- this endpoint does not filter
        content per role). Returns the file at src/main/resources/openapi.yaml verbatim from the
        classpath as text/yaml, never through the JSON content negotiator.
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/UnauthorizedError" }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Obtain a bearer token
      description: "No authentication required. Subject to a per-IP and per-username-per-IP throttle."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Credentials accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaTypeError" }
        "413": { $ref: "#/components/responses/PayloadTooLargeError" }
        "429": { $ref: "#/components/responses/TooManyRequestsError" }
        "503":
          description: >-
            The login throttle is at capacity, or the bcrypt verification slot could not be
            acquired within 2 seconds. Uses the shared ApiError envelope (unlike /health/ready).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/v1/providers:
    get:
      tags: [Providers]
      summary: List providers
      security: []
      description: >-
        No authentication required. Filters are ANDed together; paymentMethod is repeatable (a provider
        must have every listed method). Sortable fields: id, name, slug, status, createdAt,
        minMonthlyPriceUsd (sorts by the lower of minMonthlyPriceUsd and minAnnualPriceUsdPerMonth).
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Free-text match against name/slug.
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ProviderStatus" }
        - name: registrationCountry
          in: query
          schema: { type: string, pattern: "^[A-Z]{2}$" }
        - name: locationCountry
          in: query
          schema: { type: string, pattern: "^[A-Z]{2}$" }
        - name: paymentMethod
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/PaymentMethod" }
          description: Repeatable. A provider must offer every listed method (AND semantics).
        - name: hasActiveTariffs
          in: query
          schema: { type: boolean }
        - name: systemStatus
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [CONFIGURED, CANDIDATE] }
          description: >-
            Repeatable (OR semantics). Defaults to CONFIGURED and CANDIDATE. REJECTED is not
            accepted and is never visible; totalElements/totalPages reflect the visible set.
        - { $ref: "#/components/parameters/PageParam" }
        - { $ref: "#/components/parameters/SizeParam" }
        - name: sort
          in: query
          schema: { type: string }
          description: "field or field,asc|desc. Allowed fields: id, name, slug, status, createdAt, minMonthlyPriceUsd."
      responses:
        "200":
          description: A page of provider summaries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSummaryPage" }
        "400": { $ref: "#/components/responses/BadRequestError" }
    post:
      tags: [Providers]
      summary: Create a provider
      description: "Required role: EDITOR."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderWriteRequest" }
      responses:
        "201":
          description: Created. Location header points at the new provider.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderDto" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "409":
          description: The slug is already in use.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "413": { $ref: "#/components/responses/PayloadTooLargeError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaTypeError" }

  /api/v1/internal/catalog/providers:
    get:
      tags: [Providers]
      summary: Internal all-status provider index
      description: >-
        Required role: EDITOR and exact username configured by VDS_CRAWLER_USERNAME. This service
        endpoint exists for crawler and discovery reconciliation; it includes REJECTED providers.
        It is not a public catalog browse route and fails closed when the configured username is absent.
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Free-text match against name/slug.
        - name: systemStatus
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/SystemStatus" }
        - { $ref: "#/components/parameters/PageParam" }
        - { $ref: "#/components/parameters/SizeParam" }
        - name: sort
          in: query
          schema: { type: string }
          description: "field or field,asc|desc. Allowed fields: id, name, slug, status, createdAt, minMonthlyPriceUsd."
      responses:
        "200":
          description: A page of provider summaries in any system status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSummaryPage" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }

  /api/v1/internal/catalog/providers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Providers]
      summary: Internal provider detail for reconciliation
      description: "Required role: EDITOR and exact username configured by VDS_CRAWLER_USERNAME. Includes any system status."
      responses:
        "200":
          description: Full provider detail including its current data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderDetailDto" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }

  /api/v1/internal/catalog/providers/{id}/tariffs:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Providers, Tariffs]
      summary: Internal all-tariff provider read for reconciliation
      description: "Required role: EDITOR and exact username configured by VDS_CRAWLER_USERNAME. Includes tariffs belonging to any system status."
      parameters:
        - name: activeOnly
          in: query
          schema: { type: boolean, default: false }
        - { $ref: "#/components/parameters/PageParam" }
        - { $ref: "#/components/parameters/SizeParam" }
        - name: sort
          in: query
          schema: { type: string }
          description: "field or field,asc|desc. Allowed fields: id, name, createdAt."
      responses:
        "200":
          description: A page of this provider's tariffs, irrespective of provider system status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TariffPage" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }

  /api/v1/providers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Providers]
      summary: Get a provider's full detail
      security: []
      description: "No authentication required. CONFIGURED and CANDIDATE providers are visible; REJECTED providers return 404. Includes legal info, payment methods, locations and active tariffs with their current prices."
      responses:
        "200":
          description: Full provider detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderDetailDto" }
        "404": { $ref: "#/components/responses/NotFoundError" }
    put:
      tags: [Providers]
      summary: Replace a provider's core fields
      description: "Required role: EDITOR."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderWriteRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderDto" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409":
          description: The slug is already in use by another provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "413": { $ref: "#/components/responses/PayloadTooLargeError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaTypeError" }
    delete:
      tags: [Providers]
      summary: Delete a provider
      description: >-
        Required role: EDITOR. HARD-DELETES and CASCADES to this provider's legal info, payment
        methods, locations, tariffs and their entire price history. Irreversible.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }

  /api/v1/providers/{id}/tariffs:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Providers, Tariffs]
      summary: List one provider's tariffs
      security: []
      description: "No authentication required. REJECTED providers return 404. Sortable fields: id, name, createdAt."
      parameters:
        - name: activeOnly
          in: query
          schema: { type: boolean, default: false }
          description: Defaults to false (unlike GET /api/v1/tariffs, which defaults to true).
        - { $ref: "#/components/parameters/PageParam" }
        - { $ref: "#/components/parameters/SizeParam" }
        - name: sort
          in: query
          schema: { type: string }
          description: "field or field,asc|desc. Allowed fields: id, name, createdAt."
      responses:
        "200":
          description: A page of this provider's tariffs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TariffPage" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
    post:
      tags: [Tariffs]
      summary: Create a tariff under a provider
      description: "Required role: EDITOR."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TariffWriteRequest" }
      responses:
        "201":
          description: Created. Location header points at the new tariff.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TariffDto" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409":
          description: The tariff name or externalId is already in use for this provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "413": { $ref: "#/components/responses/PayloadTooLargeError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaTypeError" }

  /api/v1/providers/{id}/system-status:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Providers]
      summary: Set a provider's system status
      description: >-
        Required role: EDITOR. Sets provider.systemStatus explicitly; any of the three values is
        accepted. This is also the call the crawler makes to promote a CANDIDATE row it has just
        written to for the first time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderSystemStatusWriteRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderDto" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "413": { $ref: "#/components/responses/PayloadTooLargeError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaTypeError" }

  /api/v1/providers/{id}/legal-info:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Providers]
      summary: Replace a provider's legal info (upsert)
      description: >-
        Required role: EDITOR. writeMode HUMAN (default) replaces the record; a field origin that is
        absent becomes MANUAL for a field that has a value or is being cleared, and a field that was
        empty and stays empty keeps its origin. writeMode AUTOMATIC follows "manual wins": a MANUAL
        field is never changed, an absent field is left alone, verified_at is never touched (sending
        verifiedAt is a 400), and registrationNumber, legalAddress, dataSource, confidence and
        sourceUrl are written only while no legal field is MANUAL.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalInfoWriteRequest" }
      responses:
        "200":
          description: Upserted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalInfoDto" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "413": { $ref: "#/components/responses/PayloadTooLargeError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaTypeError" }

  /api/v1/providers/{id}/enrichment:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Providers]
      summary: Apply one automatic enrichment result
      description: >-
        Required role: EDITOR. The writer is the separate enrichment process (EnrichMainKt), logged in
        as its own EDITOR account. The whole body is validated before
        anything is written; any failure is a 400 with no writes. Applied in one transaction under
        the provider row lock: a MANUAL legal field is never changed; empty, unclaimed or AUTO_* legal
        fields take the found value; HIGH/MEDIUM payment methods and countries are only added, never
        removed, and never when dismissed or listed in observedFacets; a country is added as a
        country-only AUTO location only when the provider has no location of that country at all.
        The enrichment state is always updated; the evidence is replaced only for SUCCESS and
        NOTHING_FOUND. Facets are allowed only with SUCCESS.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrichmentApplyRequest" }
      responses:
        "200":
          description: Applied. The body lists what was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrichmentApplyResultDto" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "413": { $ref: "#/components/responses/PayloadTooLargeError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaTypeError" }

  /api/v1/providers/{id}/legal-info/confirm:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Providers]
      summary: Confirm legal fields as manual
      description: >-
        Required role: EDITOR. Sets the origin of each listed field to MANUAL, keeps its value and
        sets verifiedAt to the server clock. 404 when the provider or its legal info does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalFieldsRequest" }
      responses:
        "200":
          description: Confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalInfoDto" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "413": { $ref: "#/components/responses/PayloadTooLargeError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaTypeError" }

  /api/v1/providers/{id}/legal-info/release:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Providers]
      summary: Release legal fields to automation
      description: >-
        Required role: EDITOR. Clears the origin of each listed field and keeps its value, so the next
        enrichment may overwrite it. 404 when the provider or its legal info does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalFieldsRequest" }
      responses:
        "200":
          description: Released.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalInfoDto" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "413": { $ref: "#/components/responses/PayloadTooLargeError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaTypeError" }

  /api/v1/providers/{id}/payment-methods:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Providers]
      summary: Replace a provider's accepted payment methods
      description: >-
        Required role: EDITOR. The whole list is replaced; duplicates in the body are rejected with 400.
        Rows that already existed keep their origin; new rows are MANUAL (writeMode HUMAN) or AUTO
        (AUTOMATIC). A HUMAN request that removes an AUTO method records a dismissal, so enrichment
        never re-adds it, and a HUMAN request that adds a dismissed method clears the dismissal.
      parameters:
        - name: writeMode
          in: query
          required: false
          schema: { $ref: "#/components/schemas/WriteMode" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/PaymentMethodWriteRequest" }
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProviderPaymentMethodDto" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "413": { $ref: "#/components/responses/PayloadTooLargeError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaTypeError" }

  /api/v1/providers/{id}/locations:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Locations]
      summary: Add a location to a provider
      description: >-
        Required role: EDITOR. latitude and longitude must be supplied together or not at all. The new
        row is MANUAL (writeMode HUMAN, which also clears a dismissal of that country) or AUTO
        (AUTOMATIC).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationWriteRequest" }
      responses:
        "201":
          description: Created. Location header points at the new location.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationDto" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409":
          description: A location already exists for this provider/country/city/datacenter combination.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "413": { $ref: "#/components/responses/PayloadTooLargeError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaTypeError" }

  /api/v1/locations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Locations]
      summary: Replace a location
      description: >-
        Required role: EDITOR. writeMode HUMAN makes the row MANUAL; AUTOMATIC keeps its origin. A
        HUMAN edit that moves the last AUTO location of a country elsewhere records a dismissal of
        that country.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationWriteRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationDto" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409":
          description: A location already exists for this provider/country/city/datacenter combination.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "413": { $ref: "#/components/responses/PayloadTooLargeError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaTypeError" }
    delete:
      tags: [Locations]
      summary: Delete a location
      description: "Required role: EDITOR. Deleting the last AUTO location of a country records a dismissal of that country, so enrichment never re-adds it."
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }

  /api/v1/tariffs:
    get:
      tags: [Tariffs]
      summary: Cross-provider tariff search
      security: []
      description: >-
        No authentication required. Only tariffs belonging to CONFIGURED and CANDIDATE providers
        are included. billingPeriod defaults to MONTHLY; activeOnly defaults to true;
        inStock has no default (absent = no filter). Sortable fields: id, priceUsd, ramMb,
        vcpuCount, diskGb, name.
      parameters:
        - name: providerId
          in: query
          schema: { type: integer, format: int64 }
        - name: country
          in: query
          schema: { type: string, pattern: "^[A-Z]{2}$" }
          description: Matches a linked location's country code.
        - name: minVcpu
          in: query
          schema: { type: integer }
        - name: minRamMb
          in: query
          schema: { type: integer }
        - name: minDiskGb
          in: query
          schema: { type: integer }
        - name: diskType
          in: query
          schema: { $ref: "#/components/schemas/DiskType" }
        - name: billingPeriod
          in: query
          schema:
            allOf: [{ $ref: "#/components/schemas/BillingPeriod" }]
            default: MONTHLY
        - { $ref: "#/components/parameters/IncludeAnnualParam" }
        - name: maxPriceUsd
          in: query
          schema: { type: string, pattern: "^\\d{1,8}(\\.\\d{1,4})?$" }
        - name: paymentMethod
          in: query
          schema: { $ref: "#/components/schemas/PaymentMethod" }
          description: Single value (not repeatable here, unlike GET /api/v1/providers).
        - name: unmeteredTraffic
          in: query
          schema: { type: boolean }
        - name: activeOnly
          in: query
          schema: { type: boolean, default: true }
        - name: inStock
          in: query
          schema: { type: boolean }
          description: No default; absent means no filter on stock status.
        - name: hasPrice
          in: query
          schema: { type: boolean }
          description: >-
            true keeps tariffs with a current price for the selected periods, false keeps those
            without one. An absent value applies no filter.
        - { $ref: "#/components/parameters/PageParam" }
        - { $ref: "#/components/parameters/SizeParam" }
        - name: sort
          in: query
          schema: { type: string }
          description: "field or field,asc|desc. Allowed fields: id, priceUsd, ramMb, vcpuCount, diskGb, name."
      responses:
        "200":
          description: A page of search results with providers and current prices for the selected billing periods.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TariffSearchItemPage" }
        "400": { $ref: "#/components/responses/BadRequestError" }

  /api/v1/tariffs/by-provider:
    get:
      tags: [Tariffs]
      summary: Cheapest matching tariff per provider
      security: []
      description: >-
        No authentication required. Only CONFIGURED and CANDIDATE providers are included. One element per provider that has at least one tariff matching the
        filters with a current MONTHLY price or, with includeAnnual=true, a current ANNUAL price.
        cheapestTariff is the matching tariff with the lowest USD price per month, with missing
        values last and ties broken by the smaller tariff id. matchingTariffCount includes it.
        totalElements counts providers. activeOnly defaults to true. Sortable fields: priceUsd (the
        cheapest USD price per month; absent values last in both directions), name (provider name),
        id (provider id). An absent sort means priceUsd,asc.
      parameters:
        - name: providerId
          in: query
          schema: { type: integer, format: int64 }
        - name: country
          in: query
          schema: { type: string, pattern: "^[A-Z]{2}$" }
          description: Matches a linked location's country code.
        - name: minVcpu
          in: query
          schema: { type: integer }
        - name: minRamMb
          in: query
          schema: { type: integer }
        - name: minDiskGb
          in: query
          schema: { type: integer }
        - name: diskType
          in: query
          schema: { $ref: "#/components/schemas/DiskType" }
        - { $ref: "#/components/parameters/IncludeAnnualParam" }
        - name: maxPriceUsd
          in: query
          schema: { type: string, pattern: "^\\d{1,8}(\\.\\d{1,4})?$" }
        - name: paymentMethod
          in: query
          schema: { $ref: "#/components/schemas/PaymentMethod" }
          description: Single value (not repeatable here, unlike GET /api/v1/providers).
        - name: unmeteredTraffic
          in: query
          schema: { type: boolean }
        - name: activeOnly
          in: query
          schema: { type: boolean, default: true }
        - name: inStock
          in: query
          schema: { type: boolean }
          description: No default; absent means no filter on stock status.
        - { $ref: "#/components/parameters/PageParam" }
        - { $ref: "#/components/parameters/SizeParam" }
        - name: sort
          in: query
          schema: { type: string }
          description: "field or field,asc|desc. Allowed fields: priceUsd, name, id. Default: priceUsd,asc."
      responses:
        "200":
          description: A page of providers, each with its cheapest matching tariff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCheapestTariffPage" }
        "400": { $ref: "#/components/responses/BadRequestError" }

  /api/v1/tariffs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Tariffs]
      summary: Get a tariff's full detail
      security: []
      description: "No authentication required. Tariffs belonging to REJECTED providers return 404. Includes its provider, linked locations and one current price per billing period that has one."
      responses:
        "200":
          description: Full tariff detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TariffDetailDto" }
        "404": { $ref: "#/components/responses/NotFoundError" }
    put:
      tags: [Tariffs]
      summary: Replace a tariff's fields
      description: "Required role: EDITOR."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TariffWriteRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TariffDto" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409":
          description: The tariff name or externalId is already in use for this provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "413": { $ref: "#/components/responses/PayloadTooLargeError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaTypeError" }
    delete:
      tags: [Tariffs]
      summary: Delete a tariff
      description: >-
        Required role: EDITOR. HARD-DELETES and CASCADES to this tariff's location links and its
        entire price history. Irreversible.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }

  /api/v1/tariffs/{id}/price-history:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Tariffs, Prices]
      summary: Raw price history for a tariff
      security: []
      description: "No authentication required. Tariffs belonging to REJECTED providers return 404. An empty history is a valid 200, not a 404."
      parameters:
        - name: billingPeriod
          in: query
          schema: { $ref: "#/components/schemas/BillingPeriod" }
        - name: from
          in: query
          schema: { type: string, format: date-time }
          description: ISO-8601 with an explicit offset, inclusive lower bound.
        - name: to
          in: query
          schema: { type: string, format: date-time }
          description: ISO-8601 with an explicit offset, inclusive upper bound.
      responses:
        "200":
          description: Price history rows, oldest or newest first per the repository's own ordering.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PriceHistoryItemDto" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "404": { $ref: "#/components/responses/NotFoundError" }

  /api/v1/tariffs/{id}/locations:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Tariffs, Locations]
      summary: Replace the set of locations a tariff is available in
      description: >-
        Required role: EDITOR. Replaces the whole link set atomically. A duplicate id in the body
        is a 400; a location belonging to a different provider than the tariff is a 409; an
        unknown location id is a 404 and leaves the previous link set untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: integer, format: int64 }
      responses:
        "200":
          description: The resulting set of location ids, sorted ascending.
          content:
            application/json:
              schema:
                type: array
                items: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409":
          description: A listed location belongs to a different provider than the tariff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "413": { $ref: "#/components/responses/PayloadTooLargeError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaTypeError" }

  /api/v1/tariffs/{id}/price:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Prices]
      summary: Set the current price for a billing period
      description: >-
        Required role: EDITOR. 200 = amount and currency equal the current row: no row is added and
        no value changes (effectiveFrom and dataSource are ignored), only that row's lastConfirmedAt
        advances to the time of the request. 201 = a new row is inserted and the previous
        current row for this billing period is closed at the new row's effectiveFrom. 409 = the
        requested effectiveFrom is back-dated or equal to the current row's effectiveFrom. 400 =
        effectiveFrom is more than 60 seconds in the future. The response carries
        warnings: ["NO_FX_RATE"] when no FX rate was available to compute the USD equivalent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceWriteRequest" }
      responses:
        "200":
          description: The submitted amount/currency already is the current price; only lastConfirmedAt advanced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceDto" }
        "201":
          description: A new current price row was inserted; the previous one (if any) was closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceDto" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409":
          description: effectiveFrom is back-dated or equal to the current row's effectiveFrom.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "413": { $ref: "#/components/responses/PayloadTooLargeError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaTypeError" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /api/v1/tariffs/{id}/price/close:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Prices]
      summary: Close the current price for a billing period
      description: >-
        Required role: EDITOR. Sets effectiveTo on the current row; never reopens a closed row.
        400 if effectiveTo is more than 60 seconds in the future; 409 if effectiveTo is not after
        the current row's effectiveFrom; 404 if there is no current price for this billing period.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceCloseRequest" }
      responses:
        "200":
          description: Closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceDto" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409":
          description: effectiveTo is not after the current row's effectiveFrom.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "413": { $ref: "#/components/responses/PayloadTooLargeError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaTypeError" }

  /api/v1/tariffs/{id}/prices/{priceId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: priceId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Prices]
      summary: Correct (delete) a price row
      description: >-
        Required role: ADMIN. Deletes the price row and reopens the row that preceded it, if any.
        409 if the targeted row is not the current one (effectiveTo already set) -- only the
        current row of a billing period can be corrected.
      responses:
        "204": { description: Deleted and, if applicable, the preceding row was reopened. }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409":
          description: Only the current price row (effectiveTo not yet set) can be corrected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/v1/admin/users:
    post:
      tags: [Admin]
      summary: Create a user
      description: "Required role: ADMIN."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Created. Location header points at the new user.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDto" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "409":
          description: Username already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "413": { $ref: "#/components/responses/PayloadTooLargeError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaTypeError" }
    get:
      tags: [Admin]
      summary: List users
      description: "Required role: ADMIN. Sortable fields: id, username, createdAt, lastLoginAt, status."
      parameters:
        - { $ref: "#/components/parameters/PageParam" }
        - { $ref: "#/components/parameters/SizeParam" }
        - name: sort
          in: query
          schema: { type: string }
          description: "field or field,asc|desc. Allowed fields: id, username, createdAt, lastLoginAt, status."
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }

  /api/v1/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [Admin]
      summary: Change a user's status and/or roles
      description: >-
        Required role: ADMIN. The body must include status or roles (or both) -- an empty body is
        a 400. 409 if this change would leave no active ADMIN user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchUserRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDto" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409":
          description: This change would leave no active ADMIN user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "413": { $ref: "#/components/responses/PayloadTooLargeError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaTypeError" }

  /api/v1/admin/users/{id}/password:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Admin]
      summary: Change a user's password
      description: "Required role: ADMIN."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Changed. }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "413": { $ref: "#/components/responses/PayloadTooLargeError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaTypeError" }

  /api/v1/admin/fx/refresh:
    post:
      tags: [Admin]
      summary: Refresh FX rates from the upstream provider
      description: >-
        Required role: EDITOR (not ADMIN -- this is an operational, not a user-management, action).
        502 if the upstream FX provider is unavailable or answers unusably.
      responses:
        "200":
          description: Refreshed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FxRefreshResponse" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "502": { $ref: "#/components/responses/BadGatewayError" }

  /api/v1/admin/crawl/run:
    post:
      tags: [Admin]
      summary: Trigger a crawl run
      description: >-
        Required role: ADMIN. Starts a run asynchronously and returns immediately; the run is
        already visible as RUNNING via GET /api/v1/admin/crawl/runs/{runId}. 409 if a run is
        already in progress (at most one run at a time, process-wide). 503 if the crawler is
        disabled (VDS_CRAWLER_ENABLED=false).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrawlRunTriggerRequest" }
      responses:
        "202":
          description: Accepted; the run has started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrawlRunTriggerResponse" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "409":
          description: A crawl run is already in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }

  /api/v1/admin/crawl/runs:
    get:
      tags: [Admin]
      summary: The most recent crawl runs
      description: >-
        Required role: ADMIN. The last 20 run summaries from the in-memory ring buffer, newest
        first; nothing is persisted, so this is empty after a restart. 503 if the crawler is
        disabled.
      responses:
        "200":
          description: Up to 20 summaries, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CrawlRunSummaryDto" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }

  /api/v1/admin/crawl/runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Admin]
      summary: One crawl run summary
      description: >-
        Required role: ADMIN. 404 if runId is unknown, was evicted from the 20-entry ring buffer,
        or is not a valid UUID. 503 if the crawler is disabled.
      responses:
        "200":
          description: The run summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrawlRunSummaryDto" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }

  /api/v1/admin/crawl/adapters:
    get:
      tags: [Admin]
      summary: Registered crawler adapters
      description: >-
        Required role: ADMIN. enabled reflects whether the current VDS_CRAWLER_ADAPTERS
        configuration selects this adapter. 503 if the crawler is disabled.
      responses:
        "200":
          description: Every registered adapter.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdapterInfoDto" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }

  /api/v1/admin/discovery/run:
    post:
      tags: [Admin]
      summary: Trigger a discovery pass
      description: >-
        Required role: ADMIN. Starts a pass asynchronously and returns immediately; the pass is
        already visible as RUNNING via GET /api/v1/admin/discovery/passes/{passId}. 409 if a
        discovery pass or a crawl run holds the shared run slot. 503 if discovery is disabled, or
        enabled while the crawler (VDS_CRAWLER_ENABLED) is not. A dry run still searches (and
        spends credits) but writes nothing. The pass stops searching once
        VDS_DISCOVERY_MAX_NEW_CANDIDATES_PER_PASS candidates are found; an unresolved 429 from the
        search vendor fails that query only.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryRunTriggerRequest" }
            example: { dryRun: true, maxQueries: 1 }
      responses:
        "202":
          description: Accepted; the pass has started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryRunTriggerResponse" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "409":
          description: A discovery pass or a crawl run is already in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }

  /api/v1/admin/discovery/passes:
    get:
      tags: [Admin]
      summary: The most recent discovery passes
      description: >-
        Required role: ADMIN. The last 20 pass summaries from the in-memory ring buffer, newest
        first; nothing is persisted. 503 if discovery is disabled.
      responses:
        "200":
          description: Up to 20 summaries, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiscoveryPassSummaryDto" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }

  /api/v1/admin/discovery/passes/{passId}:
    parameters:
      - name: passId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Admin]
      summary: One discovery pass summary
      description: >-
        Required role: ADMIN. 404 if passId is unknown, was evicted from the 20-entry ring buffer,
        or is not a valid UUID. 503 if discovery is disabled.
      responses:
        "200":
          description: The pass summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryPassSummaryDto" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }

  /api/v1/admin/discovery/sources:
    get:
      tags: [Admin]
      summary: Declarative sources loaded at startup
      description: >-
        Required role: ADMIN. The startup snapshot of VDS_DISCOVERY_SOURCES_DIR: every loaded
        source and every file that failed to load, with its errors (restart-to-apply). 503 if
        discovery is disabled, or enabled while the crawler is not.
      responses:
        "200":
          description: The startup load report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoverySourcesDto" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }

  /api/v1/dictionaries:
    get:
      tags: [Dictionaries]
      summary: Every enum value set the frontend needs
      security: []
      description: "No authentication required."
      responses:
        "200":
          description: One array per enum.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DictionariesDto" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Required for every endpoint except GET /health, GET /health/ready, GET /version,
        POST /api/v1/auth/login, and the public catalog GET operations.

  parameters:
    IncludeAnnualParam:
      name: includeAnnual
      in: query
      schema: { type: boolean, default: false }
      description: >-
        Includes current ANNUAL prices alongside MONTHLY prices. priceUsd sorting and maxPriceUsd
        filtering use the lower of the monthly USD price and the annual USD price divided by 12
        and rounded half up to four decimal places. Requires MONTHLY when billingPeriod is supplied.
    PageParam:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
      description: Zero-based page index. Out of range is rejected with 400, never clamped.
    SizeParam:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Page size, 1-100. Out of range is rejected with 400, never clamped.

  responses:
    BadRequestError:
      description: The request body or query string failed validation, or the body could not be parsed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    UnauthorizedError:
      description: Missing, malformed or expired bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ForbiddenError:
      description: Authenticated, but the token's roles do not include the role this endpoint requires.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFoundError:
      description: No resource exists at this id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    PayloadTooLargeError:
      description: The request body exceeds the 256 KB limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    UnsupportedMediaTypeError:
      description: The request body is missing a Content-Type header, or it is not application/json.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    TooManyRequestsError:
      description: Too many login attempts for this IP, or this username from this IP, within the throttle window.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    InternalServerError:
      description: An unexpected failure. The body never contains a stack trace or internal detail.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    BadGatewayError:
      description: An upstream dependency answered, but unusably.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ServiceUnavailableError:
      description: A dependency is down or at capacity.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  schemas:
    ApiErrorDetail:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }

    ApiError:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
          description: UTC, Z suffix, whole-second precision.
        status: { type: integer }
        error: { type: string, description: "The HTTP status reason phrase." }
        message: { type: string }
        path: { type: string }
        details:
          type: array
          items: { $ref: "#/components/schemas/ApiErrorDetail" }
          description: Present only on a validation failure (400 from a Validation accumulator); omitted otherwise.

    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [UP] }

    ReadinessFailureResponse:
      type: object
      required: [status, reason]
      properties:
        status: { type: string, enum: [DOWN] }
        reason: { type: string }

    VersionResponse:
      type: object
      required: [version, buildTimestamp]
      properties:
        version: { type: string }
        buildTimestamp: { type: string }

    ProviderStatus: { type: string, enum: [ACTIVE, INACTIVE, UNKNOWN] }
    SystemStatus: { type: string, enum: [CANDIDATE, CONFIGURED, REJECTED] }
    LegalDataSource: { type: string, enum: [MANUAL, CRAWLER, WHOIS, PROVIDER_SITE, UNKNOWN] }
    Confidence: { type: string, enum: [HIGH, MEDIUM, LOW, UNVERIFIED] }
    DiskType: { type: string, enum: [NVME, SSD, HDD, UNKNOWN] }
    Virtualization: { type: string, enum: [KVM, OPENVZ, LXC, XEN, HYPERV, UNKNOWN] }
    BillingPeriod: { type: string, enum: [HOURLY, MONTHLY, QUARTERLY, SEMIANNUAL, ANNUAL, BIENNIAL, TRIENNIAL] }
    PriceDataSource: { type: string, enum: [MANUAL, CRAWLER] }
    UserStatus: { type: string, enum: [ACTIVE, DISABLED] }
    Role: { type: string, enum: [ADMIN, EDITOR, VIEWER] }
    FieldOrigin:
      type: string
      enum: [AUTO_CONFIRMED, AUTO_PRESUMED, MANUAL]
      description: Absent on a legal field means nobody claimed it; automation may fill it.
    RowOrigin: { type: string, enum: [AUTO, MANUAL] }
    EnrichmentOutcome:
      type: string
      enum: [SUCCESS, NOTHING_FOUND, BLOCKED, UNREACHABLE, ROBOTS_DISALLOWED, FAILED, TIMEOUT, DEFERRED, NOT_DUE, SKIPPED, NO_PROVIDER, DISABLED]
    WriteMode: { type: string, enum: [HUMAN, AUTOMATIC], default: HUMAN }
    PaymentMethod:
      type: string
      enum:
        - VISA_MASTERCARD
        - AMERICAN_EXPRESS
        - UNIONPAY
        - MIR
        - SBP
        - RU_BANK_TRANSFER
        - BANK_WIRE
        - PAYPAL
        - ALIPAY
        - WECHAT_PAY
        - APPLE_PAY
        - GOOGLE_PAY
        - CRYPTO_BTC
        - CRYPTO_ETH
        - CRYPTO_USDT
        - CRYPTO_OTHER
        - WEBMONEY
        - PERFECT_MONEY
        - CASH
        - OTHER

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, expiresAt, username, roles]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        username: { type: string }
        roles:
          type: array
          items: { type: string }

    ProviderWriteRequest:
      type: object
      required: [slug, name, websiteUrl, status]
      properties:
        slug: { type: string, pattern: "^[a-z0-9-]+$", maxLength: 64 }
        name: { type: string, maxLength: 255 }
        websiteUrl: { type: string, format: uri, maxLength: 2048, description: Absolute http(s) URL with a host. }
        description: { type: string }
        status: { $ref: "#/components/schemas/ProviderStatus" }
        systemStatus:
          allOf: [{ $ref: "#/components/schemas/SystemStatus" }]
          description: >-
            Optional. On POST it defaults to CONFIGURED; on PUT an absent value leaves the current
            one unchanged (it never defaults to CONFIGURED there).

    ProviderSystemStatusWriteRequest:
      type: object
      required: [systemStatus]
      properties:
        systemStatus: { $ref: "#/components/schemas/SystemStatus" }

    ProviderDto:
      type: object
      required: [id, slug, name, websiteUrl, status, systemStatus, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        name: { type: string }
        websiteUrl: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/ProviderStatus" }
        systemStatus: { $ref: "#/components/schemas/SystemStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LegalInfoWriteRequest:
      type: object
      required: [dataSource, confidence]
      properties:
        legalEntityName: { type: string, maxLength: 255 }
        registrationCountry: { type: string, pattern: "^[A-Z]{2}$" }
        registrationNumber: { type: string, maxLength: 128 }
        legalAddress: { type: string }
        dataSource: { $ref: "#/components/schemas/LegalDataSource" }
        confidence: { $ref: "#/components/schemas/Confidence" }
        sourceUrl: { type: string, maxLength: 2048 }
        verifiedAt: { type: string, format: date-time, description: "Must be absent when writeMode is AUTOMATIC." }
        legalEntityNameOrigin:
          $ref: "#/components/schemas/FieldOrigin"
        registrationCountryOrigin:
          $ref: "#/components/schemas/FieldOrigin"
        writeMode: { $ref: "#/components/schemas/WriteMode" }

    LegalInfoDto:
      type: object
      required: [providerId, dataSource, confidence, updatedAt]
      properties:
        providerId: { type: integer, format: int64 }
        legalEntityName: { type: string }
        registrationCountry: { type: string }
        registrationNumber: { type: string }
        legalAddress: { type: string }
        dataSource: { $ref: "#/components/schemas/LegalDataSource" }
        confidence: { $ref: "#/components/schemas/Confidence" }
        sourceUrl: { type: string }
        verifiedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        legalEntityNameOrigin: { $ref: "#/components/schemas/FieldOrigin" }
        registrationCountryOrigin: { $ref: "#/components/schemas/FieldOrigin" }

    PaymentMethodWriteRequest:
      type: object
      required: [method]
      properties:
        method: { $ref: "#/components/schemas/PaymentMethod" }
        note: { type: string }

    ProviderPaymentMethodDto:
      type: object
      required: [method, origin]
      properties:
        method: { $ref: "#/components/schemas/PaymentMethod" }
        note: { type: string }
        origin: { $ref: "#/components/schemas/RowOrigin" }

    ProviderSummaryDto:
      type: object
      required: [id, slug, name, websiteUrl, status, systemStatus, paymentMethods, locationCountryCodes, activeTariffCount]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        name: { type: string }
        websiteUrl: { type: string }
        status: { $ref: "#/components/schemas/ProviderStatus" }
        systemStatus: { $ref: "#/components/schemas/SystemStatus" }
        registrationCountry: { type: string }
        legalEntityName: { type: string }
        legalEntityNameOrigin: { $ref: "#/components/schemas/FieldOrigin" }
        registrationCountryOrigin: { $ref: "#/components/schemas/FieldOrigin" }
        paymentMethods:
          type: array
          items: { $ref: "#/components/schemas/PaymentMethod" }
        locationCountryCodes:
          type: array
          items: { type: string }
        activeTariffCount: { type: integer }
        minMonthlyPriceUsd:
          type: string
          pattern: "^\\d{1,8}(\\.\\d{1,4})?$"
          description: >-
            The cheapest current MONTHLY price among this provider's tariffs that are active and in
            stock; absent when there is none.
        minAnnualPriceUsdPerMonth:
          type: string
          pattern: "^\\d{1,8}(\\.\\d{1,4})?$"
          description: >-
            The cheapest current ANNUAL price among this provider's tariffs that are active and in
            stock, divided by 12 (4 decimals, half-up); absent when there is none.
        enrichmentLastAttemptAt:
          type: string
          format: date-time
          description: >-
            When the latest enrichment attempt was recorded, as ProviderEnrichmentDto.lastAttemptAt.
            Absent when the provider was never attempted. The enrichment process orders its queue by it.

    TariffWithPricesDto:
      type: object
      required: [tariff, prices]
      properties:
        tariff: { $ref: "#/components/schemas/TariffDto" }
        prices:
          type: array
          items: { $ref: "#/components/schemas/PriceDto" }

    ProviderDetailDto:
      type: object
      required: [provider, paymentMethods, locations, tariffs]
      properties:
        provider: { $ref: "#/components/schemas/ProviderDto" }
        legalInfo: { $ref: "#/components/schemas/LegalInfoDto" }
        paymentMethods:
          type: array
          items: { $ref: "#/components/schemas/ProviderPaymentMethodDto" }
        locations:
          type: array
          items: { $ref: "#/components/schemas/LocationDto" }
        tariffs:
          type: array
          items: { $ref: "#/components/schemas/TariffWithPricesDto" }
          description: Active tariffs only.
        enrichment:
          $ref: "#/components/schemas/ProviderEnrichmentDto"

    ProviderEnrichmentDto:
      type: object
      description: >-
        State of the latest enrichment attempt, written by the separate enrichment process through
        PUT /api/v1/providers/{id}/enrichment; absent from ProviderDetailDto when none was made.
      required: [lastAttemptAt, lastOutcome, lastPagesFetched]
      properties:
        lastAttemptAt: { type: string, format: date-time }
        lastOutcome: { $ref: "#/components/schemas/EnrichmentOutcome" }
        lastMessage: { type: string, maxLength: 500 }
        lastPagesFetched: { type: integer, minimum: 0 }
        lastSuccessAt: { type: string, format: date-time }
        evidence: { $ref: "#/components/schemas/EnrichmentEvidenceDto" }

    EvidenceItemDto:
      type: object
      required: [url, kind, snippet]
      properties:
        url: { type: string, maxLength: 2048, description: "Absolute http or https URL." }
        kind: { type: string, maxLength: 64 }
        snippet: { type: string, maxLength: 220 }

    LegalFindingDto:
      type: object
      required: [value, status]
      properties:
        value: { type: string, description: "Entity name (at most 255 characters) or ISO alpha-2 country code." }
        status: { type: string, enum: [CONFIRMED, PRESUMED] }
        basis: { type: array, maxItems: 10, items: { type: string, maxLength: 64 } }
        alternatives: { type: array, maxItems: 3, items: { type: string, maxLength: 255 } }
        evidence:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/EvidenceItemDto" }
          description: Strongest first; the first item's URL becomes the legal info's sourceUrl.

    ValueFindingDto:
      type: object
      required: [value, confidence]
      properties:
        value: { type: string, description: "A PaymentMethod value or an ISO alpha-2 country code." }
        confidence: { type: string, enum: [HIGH, MEDIUM, LOW], description: "Only HIGH and MEDIUM are written." }
        pages: { type: integer, minimum: 0, description: "How many fetched pages mentioned the value." }
        evidence:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/EvidenceItemDto" }

    EnrichmentEvidenceDto:
      type: object
      required: [paymentMethods, locations]
      properties:
        legalEntityName: { $ref: "#/components/schemas/LegalFindingDto" }
        registrationCountry: { $ref: "#/components/schemas/LegalFindingDto" }
        paymentMethods:
          type: array
          items: { $ref: "#/components/schemas/ValueFindingDto" }
        locations:
          type: array
          items: { $ref: "#/components/schemas/ValueFindingDto" }

    EnrichmentApplyRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [SUCCESS, NOTHING_FOUND, BLOCKED, UNREACHABLE, ROBOTS_DISALLOWED, FAILED, TIMEOUT]
        message: { type: string, maxLength: 500 }
        pagesFetched: { type: integer, minimum: 0, default: 0 }
        observedFacets:
          type: array
          items: { type: string, enum: [LEGAL_ENTITY_NAME, REGISTRATION_COUNTRY, PAYMENT_METHOD, LOCATION] }
          description: Facets the provider's source already observes; they are not written, but their evidence is stored.
        legalEntityName: { $ref: "#/components/schemas/LegalFindingDto" }
        registrationCountry: { $ref: "#/components/schemas/LegalFindingDto" }
        paymentMethods:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ValueFindingDto" }
        locations:
          type: array
          maxItems: 25
          items: { $ref: "#/components/schemas/ValueFindingDto" }

    EnrichmentApplyResultDto:
      type: object
      required: [paymentMethods, locations, valuesApplied]
      properties:
        legalEntityName: { type: string, description: "Present only when the field was written." }
        registrationCountry: { type: string, description: "Present only when the field was written." }
        paymentMethods:
          type: array
          items: { $ref: "#/components/schemas/PaymentMethod" }
        locations:
          type: array
          items: { type: string }
        valuesApplied: { type: integer }

    LegalFieldsRequest:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          minItems: 1
          items: { type: string, enum: [LEGAL_ENTITY_NAME, REGISTRATION_COUNTRY] }

    LocationWriteRequest:
      type: object
      required: [countryCode]
      properties:
        countryCode: { type: string, pattern: "^[A-Z]{2}$" }
        region: { type: string, maxLength: 128 }
        city: { type: string, maxLength: 128 }
        datacenterName: { type: string, maxLength: 255 }
        latitude:
          type: string
          pattern: "^-?\\d{1,3}(\\.\\d{1,6})?$"
          description: NUMERIC(9,6), range -90..90. Must be supplied together with longitude or not at all.
        longitude:
          type: string
          pattern: "^-?\\d{1,3}(\\.\\d{1,6})?$"
          description: NUMERIC(9,6), range -180..180. Must be supplied together with latitude or not at all.
        writeMode: { $ref: "#/components/schemas/WriteMode" }

    LocationDto:
      type: object
      required: [id, providerId, countryCode, createdAt, updatedAt, origin]
      properties:
        id: { type: integer, format: int64 }
        providerId: { type: integer, format: int64 }
        countryCode: { type: string }
        region: { type: string }
        city: { type: string }
        datacenterName: { type: string }
        latitude: { type: string, pattern: "^-?\\d{1,3}(\\.\\d{1,6})?$" }
        longitude: { type: string, pattern: "^-?\\d{1,3}(\\.\\d{1,6})?$" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        origin: { $ref: "#/components/schemas/RowOrigin" }

    TariffWriteRequest:
      type: object
      required: [name, vcpuCount, ramMb, diskGb, diskType, ipv4Count, virtualization]
      properties:
        externalId: { type: string, maxLength: 128 }
        name: { type: string, maxLength: 255 }
        url: { type: string, maxLength: 2048 }
        vcpuCount: { type: integer, minimum: 1, maximum: 32767 }
        cpuModel: { type: string, maxLength: 128 }
        ramMb: { type: integer, minimum: 1 }
        diskGb: { type: integer, minimum: 1 }
        diskType: { $ref: "#/components/schemas/DiskType" }
        bandwidthMbps: { type: integer, minimum: 1 }
        trafficLimitGb: { type: integer, minimum: 1, description: "Absent means unmetered traffic, never 0." }
        ipv4Count: { type: integer, minimum: 0, maximum: 32767 }
        ipv6Supported: { type: boolean }
        virtualization: { $ref: "#/components/schemas/Virtualization" }
        isActive: { type: boolean, default: true }
        inStock: { type: boolean, default: true }

    TariffDto:
      type: object
      required: [id, providerId, name, vcpuCount, ramMb, diskGb, diskType, ipv4Count, virtualization, isActive, inStock, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        providerId: { type: integer, format: int64 }
        externalId: { type: string }
        name: { type: string }
        url: { type: string }
        vcpuCount: { type: integer }
        cpuModel: { type: string }
        ramMb: { type: integer }
        diskGb: { type: integer }
        diskType: { $ref: "#/components/schemas/DiskType" }
        bandwidthMbps: { type: integer }
        trafficLimitGb: { type: integer, description: "Absent means unmetered traffic." }
        ipv4Count: { type: integer }
        ipv6Supported: { type: boolean }
        virtualization: { $ref: "#/components/schemas/Virtualization" }
        isActive: { type: boolean }
        inStock: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TariffSearchItemDto:
      type: object
      required: [tariff, provider]
      properties:
        tariff: { $ref: "#/components/schemas/TariffDto" }
        provider: { $ref: "#/components/schemas/ProviderDto" }
        currentPrice:
          allOf: [{ $ref: "#/components/schemas/PriceDto" }]
          description: The current price for the selected period, or the cheapest option with includeAnnual.
        otherPrice:
          allOf: [{ $ref: "#/components/schemas/PriceDto" }]
          description: The other billing option, present when includeAnnual is true and both prices exist.
        annualPriceUsdPerMonth:
          type: string
          description: The monthly equivalent of the annual USD price when available with includeAnnual.

    ProviderCheapestTariffDto:
      type: object
      required: [provider, cheapestTariff, cheapestPrice, matchingTariffCount]
      properties:
        provider: { $ref: "#/components/schemas/ProviderDto" }
        cheapestTariff: { $ref: "#/components/schemas/TariffDto" }
        cheapestPrice:
          allOf: [{ $ref: "#/components/schemas/PriceDto" }]
          description: The cheapest current price of cheapestTariff for the selected periods.
        matchingTariffCount:
          type: integer
          minimum: 1
          description: How many tariffs match the filters and have a current price for a selected period, cheapestTariff included.
        otherPrice:
          allOf: [{ $ref: "#/components/schemas/PriceDto" }]
          description: The other billing option, present when includeAnnual is true and both prices exist.
        annualPriceUsdPerMonth:
          type: string
          description: The monthly equivalent of the annual USD price when available with includeAnnual.

    TariffDetailDto:
      type: object
      required: [tariff, provider, locations, currentPrices]
      properties:
        tariff: { $ref: "#/components/schemas/TariffDto" }
        provider: { $ref: "#/components/schemas/ProviderDto" }
        locations:
          type: array
          items: { $ref: "#/components/schemas/LocationDto" }
        currentPrices:
          type: array
          items: { $ref: "#/components/schemas/PriceDto" }
          description: At most one row per billingPeriod.

    LastConfirmedAt:
      type: string
      format: date-time
      description: >-
        When a client with write access last submitted this row's amount and currency: the time the
        row was written, moved forward by every later unchanged PUT .../price. Never set by a client.

    PriceHistoryItemDto:
      type: object
      required: [id, billingPeriod, amount, currency, effectiveFrom, dataSource, lastConfirmedAt]
      properties:
        id: { type: integer, format: int64 }
        billingPeriod: { $ref: "#/components/schemas/BillingPeriod" }
        amount: { type: string, pattern: "^\\d{1,8}(\\.\\d{1,4})?$" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        amountUsd: { type: string, pattern: "^\\d{1,8}(\\.\\d{1,4})?$" }
        usdRate: { type: string, pattern: "^\\d{1,8}(\\.\\d{1,12})?$" }
        usdRateAt: { type: string, format: date-time }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, description: Absent while this row is the current price. }
        dataSource: { $ref: "#/components/schemas/PriceDataSource" }
        lastConfirmedAt: { $ref: "#/components/schemas/LastConfirmedAt" }

    PriceWriteRequest:
      type: object
      required: [billingPeriod, amount, currency]
      properties:
        billingPeriod: { $ref: "#/components/schemas/BillingPeriod" }
        amount: { type: string, pattern: "^\\d{1,8}(\\.\\d{1,4})?$" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        effectiveFrom:
          type: string
          format: date-time
          description: ISO-8601 with an explicit offset. Defaults to now when absent.
        dataSource:
          allOf: [{ $ref: "#/components/schemas/PriceDataSource" }]
          description: Defaults to MANUAL when absent.

    PriceCloseRequest:
      type: object
      required: [billingPeriod]
      properties:
        billingPeriod: { $ref: "#/components/schemas/BillingPeriod" }
        effectiveTo:
          type: string
          format: date-time
          description: ISO-8601 with an explicit offset. Defaults to now when absent.

    PriceDto:
      type: object
      required: [id, tariffId, billingPeriod, amount, currency, effectiveFrom, dataSource, createdAt, lastConfirmedAt, warnings]
      properties:
        id: { type: integer, format: int64 }
        tariffId: { type: integer, format: int64 }
        billingPeriod: { $ref: "#/components/schemas/BillingPeriod" }
        amount: { type: string, pattern: "^\\d{1,8}(\\.\\d{1,4})?$" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        amountUsd: { type: string, pattern: "^\\d{1,8}(\\.\\d{1,4})?$" }
        usdRate: { type: string, pattern: "^\\d{1,8}(\\.\\d{1,12})?$" }
        usdRateAt: { type: string, format: date-time }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, description: Absent while this row is the current price. }
        dataSource: { $ref: "#/components/schemas/PriceDataSource" }
        recordedBy: { type: integer, format: int64, description: Absent for a row with no recording user. }
        createdAt: { type: string, format: date-time }
        lastConfirmedAt: { $ref: "#/components/schemas/LastConfirmedAt" }
        warnings:
          type: array
          items: { type: string, enum: [NO_FX_RATE] }
          description: "Always present, possibly empty -- encodeDefaults=true keeps this key on the wire even when empty."

    CreateUserRequest:
      type: object
      required: [username, password, roles]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string }
        email: { type: string, maxLength: 255 }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }

    PatchUserRequest:
      type: object
      description: At least one of status or roles must be present; an empty body is a 400.
      properties:
        status: { $ref: "#/components/schemas/UserStatus" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }

    ChangePasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string }

    UserDto:
      type: object
      required: [id, username, status, roles, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        email: { type: string }
        status: { $ref: "#/components/schemas/UserStatus" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time }

    FxRefreshResponse:
      type: object
      required: [inserted]
      properties:
        inserted: { type: integer, description: Number of currency_rate rows inserted by this refresh. }

    CrawlRunTriggerRequest:
      type: object
      properties:
        adapterIds:
          type: array
          items: { type: string }
          description: Defaults to the configured selection (VDS_CRAWLER_ADAPTERS) when omitted.
        dryRun:
          type: boolean
          description: Defaults to VDS_CRAWLER_DRY_RUN_DEFAULT when omitted.
        maxOutOfStockRatio:
          type: string
          description: >-
            Decimal string in [0, 1], plain notation. Defaults to VDS_CRAWLER_MAX_OUT_OF_STOCK_RATIO
            when omitted.

    CrawlRunTriggerResponse:
      type: object
      required: [runId]
      properties:
        runId: { type: string, format: uuid }

    AdapterRunResultDto:
      type: object
      required: [adapterId, providerSlug, status, durationMs]
      properties:
        adapterId: { type: string }
        providerSlug: { type: string }
        status: { type: string, enum: [SUCCESS, PARTIAL, FAILED, SKIPPED] }
        durationMs: { type: integer, format: int64 }
        pagesFetched: { type: integer }
        providersCreated: { type: integer }
        locationsCreated: { type: integer }
        tariffsCreated: { type: integer }
        tariffsUpdated: { type: integer }
        tariffsMarkedOutOfStock: { type: integer }
        pricesAppended: { type: integer }
        pricesUnchanged: { type: integer }
        noFxRateCount: { type: integer }
        failureReason:
          type: string
          enum: [VALIDATION, TIMEOUT, MASS_CHANGE_GUARD, FETCH, WRITE, AUTH, ADAPTER_ERROR]
        message: { type: string }

    CrawlRunSummaryDto:
      type: object
      required: [runId, startedAt, status, dryRun]
      properties:
        runId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        finishedAt:
          type: string
          format: date-time
          description: Absent while status is RUNNING.
        status: { type: string, enum: [RUNNING, COMPLETED, CANCELLED] }
        dryRun: { type: boolean }
        adapters:
          type: array
          items: { $ref: "#/components/schemas/AdapterRunResultDto" }
        plannedOperations:
          type: array
          items: { type: string }
          description: Filled only by a dry run; capped at 200 entries.

    AdapterInfoDto:
      type: object
      required: [id, providerSlug, sourceKind, enabled, origin]
      properties:
        id: { type: string }
        providerSlug: { type: string }
        sourceKind: { type: string, enum: [API, HTML] }
        enabled:
          type: boolean
          description: >-
            Selected by the current configuration: an empty VDS_CRAWLER_ADAPTERS selects compiled
            entries registered as default plus config-sourced entries whose own file says
            "enabled": true; a non-empty one selects exactly the ids it names.
        origin:
          type: string
          enum: [COMPILED, CONFIG]
          description: >-
            COMPILED is an adapter written in Kotlin and shipped in this build; CONFIG is a
            declarative source built from a JSON file in VDS_DISCOVERY_SOURCES_DIR, read once at
            startup (restart-to-apply).
        file:
          type: string
          description: >-
            The source file's name. Present exactly when origin is CONFIG, and absent (not null --
            the shared ApiJson omits a null) for a COMPILED entry.

    DiscoveryRunTriggerRequest:
      type: object
      properties:
        dryRun:
          type: boolean
          description: Defaults to false. A dry run still searches and spends credits; it writes nothing.
        maxQueries:
          type: integer
          minimum: 1
          description: Can only lower VDS_DISCOVERY_MAX_QUERIES_PER_PASS.
        force:
          type: boolean
          description: Overrides only the minimum interval between passes, never the monthly credit cap.

    DiscoveryRunTriggerResponse:
      type: object
      required: [passId]
      properties:
        passId: { type: string, format: uuid }

    PlannedCandidateDto:
      type: object
      required: [slug, name, websiteUrl, query, resultUrl]
      properties:
        slug:
          type: string
          description: The provider slug the candidate would get, derived from its normalized domain.
          example: example-host-com
        name: { type: string }
        websiteUrl:
          type: string
          example: https://example-host.com/
        query:
          type: string
          description: The configured search query that returned this hit.
        resultUrl:
          type: string
          description: The search hit's own URL, at most 2048 characters.

    DiscoveryPassSummaryDto:
      type: object
      required:
        - passId
        - startedAt
        - status
        - dryRun
        - queriesIssued
        - queriesFailed
        - creditsSpent
        - resultsSeen
        - resultsRejected
        - knownProviders
        - candidatesCreated
        - candidatesDeferred
        - candidatesFailed
      properties:
        passId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        finishedAt:
          type: string
          format: date-time
          description: Absent while status is RUNNING.
        status: { type: string, enum: [RUNNING, COMPLETED, CANCELLED] }
        dryRun: { type: boolean }
        queriesIssued: { type: integer }
        queriesFailed:
          type: integer
          description: Queries that ended in a search failure (rate limit, timeout, malformed answer).
        creditsSpent: { type: integer }
        creditsRemainingThisMonth:
          type: integer
          description: The local credit ledger's figure.
        vendorCreditsRemaining:
          type: integer
          description: Absent when the vendor usage cross-check was skipped or failed.
        resultsSeen: { type: integer }
        resultsRejected:
          type: object
          additionalProperties: { type: integer }
          description: >-
            Keyed by DENYLIST, KEYWORD, MALFORMED_URL, SLUG_TOO_LONG, ALREADY_KNOWN, LISTICLE; every
            key is present. MALFORMED_URL also counts a hit whose URL is longer than 2048 characters;
            LISTICLE counts ranking and comparison pages, judged by title and URL path.
          example: { DENYLIST: 12, KEYWORD: 3, MALFORMED_URL: 0, SLUG_TOO_LONG: 0, ALREADY_KNOWN: 7, LISTICLE: 2 }
        knownProviders:
          type: integer
          description: Providers already in the catalog when the pass started, in every systemStatus.
        candidatesCreated: { type: integer }
        candidatesDeferred:
          type: integer
          description: >-
            Hits that passed every filter after the per-pass candidate cap was reached. A lower
            bound: the pass stops searching at the cap, so later queries are never issued.
        candidatesFailed:
          type: integer
          description: Candidates whose create request the catalog refused; the pass went on.
        plannedCandidates:
          type: array
          items: { $ref: "#/components/schemas/PlannedCandidateDto" }
          description: Filled only by a dry run; capped at 200 entries.
        failureReason:
          type: string
          enum:
            - NO_SEARCH_PROVIDER
            - BUDGET
            - SEARCH_QUOTA
            - SEARCH_AUTH
            - KNOWN_SET_TOO_LARGE
            - CATALOG_UNAVAILABLE
            - CATALOG_AUTH
            - TIMEOUT
            - SHUTDOWN
            - INTERNAL_ERROR
        message: { type: string }

    DiscoverySourceDto:
      type: object
      required: [id, providerSlug, enabled, file, loadedAt]
      properties:
        id: { type: string }
        providerSlug: { type: string }
        enabled: { type: boolean }
        file: { type: string }
        loadedAt: { type: string, format: date-time }

    DiscoverySourceFailureDto:
      type: object
      required: [file, errors]
      properties:
        file: { type: string }
        errors:
          type: array
          items: { type: string }

    DiscoverySourcesDto:
      type: object
      required: [loaded, failed, problems]
      properties:
        directory: { type: string }
        loaded:
          type: array
          items: { $ref: "#/components/schemas/DiscoverySourceDto" }
        failed:
          type: array
          items: { $ref: "#/components/schemas/DiscoverySourceFailureDto" }
        problems:
          type: array
          items: { type: string }
          description: Directory-level refusals, as opposed to per-file failures.

    DictionariesDto:
      type: object
      required:
        - paymentMethods
        - billingPeriods
        - diskTypes
        - virtualizationTypes
        - providerStatuses
        - systemStatuses
        - confidenceLevels
        - legalDataSources
        - priceDataSources
        - fieldOrigins
        - rowOrigins
        - enrichmentOutcomes
        - dismissalFacets
      properties:
        paymentMethods: { type: array, items: { type: string } }
        billingPeriods: { type: array, items: { type: string } }
        diskTypes: { type: array, items: { type: string } }
        virtualizationTypes: { type: array, items: { type: string } }
        providerStatuses: { type: array, items: { type: string } }
        systemStatuses: { type: array, items: { type: string } }
        confidenceLevels: { type: array, items: { type: string } }
        legalDataSources: { type: array, items: { type: string } }
        priceDataSources: { type: array, items: { type: string } }
        fieldOrigins: { type: array, items: { type: string } }
        rowOrigins: { type: array, items: { type: string } }
        enrichmentOutcomes: { type: array, items: { type: string } }
        dismissalFacets: { type: array, items: { type: string } }

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer, description: "Zero for an empty result, never one empty page." }

    ProviderSummaryPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: "#/components/schemas/ProviderSummaryDto" }

    TariffPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: "#/components/schemas/TariffDto" }

    TariffSearchItemPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: "#/components/schemas/TariffSearchItemDto" }

    ProviderCheapestTariffPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: "#/components/schemas/ProviderCheapestTariffDto" }

    UserPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: "#/components/schemas/UserDto" }
