# Only Caddy publishes ports. Run Compose from this directory to load the stand's .env.
name: vds-stand

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${VDS_DB_NAME:-vds}
      POSTGRES_USER: ${VDS_DB_USER:-vds}
      POSTGRES_PASSWORD: ${VDS_DB_PASSWORD:?set VDS_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VDS_DB_USER:-vds} -d ${VDS_DB_NAME:-vds}"]
      interval: 5s
      timeout: 5s
      retries: 10
    shm_size: 128mb
    mem_limit: ${VDS_DB_MEM_LIMIT:-512m}
    logging: *logging

  app:
    image: ${VDS_IMAGE:?set VDS_IMAGE in .env}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      VDS_DB_URL: jdbc:postgresql://postgres:5432/${VDS_DB_NAME:-vds}
      VDS_DB_USER: ${VDS_DB_USER:-vds}
      VDS_DB_PASSWORD: ${VDS_DB_PASSWORD:?set VDS_DB_PASSWORD in .env}
      VDS_DB_POOL_MAX: ${VDS_DB_POOL_MAX:-5}
      VDS_JWT_SECRET: ${VDS_JWT_SECRET:?set VDS_JWT_SECRET in .env}
      VDS_JWT_TTL_HOURS: ${VDS_JWT_TTL_HOURS:-24}
      VDS_FX_API_URL: ${VDS_FX_API_URL:-https://open.er-api.com/v6/latest/USD}
      VDS_FX_REFRESH_HOURS: ${VDS_FX_REFRESH_HOURS:-12}
      VDS_BOOTSTRAP_ADMIN_USERNAME: ${VDS_BOOTSTRAP_ADMIN_USERNAME:?set VDS_BOOTSTRAP_ADMIN_USERNAME in .env}
      VDS_BOOTSTRAP_ADMIN_PASSWORD: ${VDS_BOOTSTRAP_ADMIN_PASSWORD:?set VDS_BOOTSTRAP_ADMIN_PASSWORD in .env}
      VDS_CRAWLER_USERNAME: ${VDS_ENRICH_USERNAME:-}
      VDS_CRAWLER_ENABLED: ${VDS_DISCOVERY_ENABLED:-false}
      VDS_CRAWLER_SCHEDULER_ENABLED: "false"
      VDS_CRAWLER_PASSWORD: ${VDS_ENRICH_PASSWORD:-}
      VDS_DISCOVERY_RETRY_RATE_LIMIT: "false"
      VDS_DISCOVERY_ENABLED: ${VDS_DISCOVERY_ENABLED:-false}
      VDS_DISCOVERY_SEARCH_PROVIDER: tavily
      VDS_DISCOVERY_SEARCH_API_KEY: ${VDS_DISCOVERY_SEARCH_API_KEY:-}
      VDS_DISCOVERY_INTERVAL_HOURS: 168
      VDS_DISCOVERY_MIN_PASS_INTERVAL_HOURS: 168
      VDS_DISCOVERY_MAX_QUERIES_PER_PASS: 10
      VDS_DISCOVERY_MAX_CREDITS_PER_MONTH: ${VDS_DISCOVERY_MAX_CREDITS_PER_MONTH:-50}
      VDS_DISCOVERY_STATE_FILE: /var/lib/vds-discovery/state.json
      VDS_DISCOVERY_MAX_SOURCES: ${VDS_DISCOVERY_MAX_SOURCES:-500}
      VDS_DISCOVERY_SOURCES_DIR: /catalog-sources
      VDS_CRAWLER_CONTACT_URL: ${VDS_CRAWLER_CONTACT_URL:-}
      # The app port is reachable only through Caddy, which overwrites X-Forwarded-For.
      VDS_HTTP_TRUST_FORWARDED_FOR: "true"
    volumes:
      - discovery-state:/var/lib/vds-discovery
      - ./sources:/catalog-sources:ro
    read_only: true
    tmpfs:
      # Ktor unpacks the jansi native library here at startup; a noexec tmpfs fails to load it.
      - /tmp:exec,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${VDS_APP_MEM_LIMIT:-768m}
    # Allow the application to drain requests and background work for up to about 20 seconds.
    stop_grace_period: 30s
    logging: *logging

  # One-shot enrichment runs via vds-enrich.timer or an explicit Compose run with the enrich profile.
  enrich:
    profiles: [enrich]
    image: ${VDS_IMAGE:?set VDS_IMAGE in .env}
    entrypoint: ["/app/enrich-launch.sh"]
    healthcheck:
      disable: true
    restart: "no"
    environment:
      # Compose can start the stack without these credentials. The enrichment process requires them.
      VDS_ENRICH_API_BASE_URL: http://app:8080
      VDS_ENRICH_USERNAME: ${VDS_ENRICH_USERNAME:-}
      VDS_ENRICH_PASSWORD: ${VDS_ENRICH_PASSWORD:-}
      VDS_ENRICH_BATCHES_PER_JVM: ${VDS_ENRICH_BATCHES_PER_JVM:-0}
      VDS_ENRICH_INTERVAL_HOURS: ${VDS_ENRICH_INTERVAL_HOURS:-720}
      VDS_ENRICH_PROVIDER_TIMEOUT_MINUTES: ${VDS_ENRICH_PROVIDER_TIMEOUT_MINUTES:-4}
      VDS_ENRICH_MAX_PAGES: ${VDS_ENRICH_MAX_PAGES:-25}
      VDS_ENRICH_MAX_PAGES_PER_SECTION: ${VDS_ENRICH_MAX_PAGES_PER_SECTION:-4}
      VDS_ENRICH_MAX_SITEMAPS: ${VDS_ENRICH_MAX_SITEMAPS:-4}
      VDS_ENRICH_MAX_RUNTIME_MINUTES: ${VDS_ENRICH_MAX_RUNTIME_MINUTES:-360}
      VDS_DISCOVERY_SOURCES_DIR: ${VDS_ENRICH_SOURCES_DIR:-/catalog-sources}
      VDS_DISCOVERY_MAX_SOURCES: ${VDS_DISCOVERY_MAX_SOURCES:-500}
      VDS_CRAWLER_HOST_DELAY_MS: ${VDS_CRAWLER_HOST_DELAY_MS:-2000}
      VDS_CRAWLER_MAX_BODY_BYTES: ${VDS_CRAWLER_MAX_BODY_BYTES:-2097152}
      VDS_CRAWLER_USER_AGENT: ${VDS_CRAWLER_USER_AGENT:-}
      VDS_CRAWLER_CONTACT_URL: ${VDS_CRAWLER_CONTACT_URL:-}
    volumes:
      # Shared by every `docker compose run`, so the launcher's flock spans them.
      - enrich-lock:/var/lock/vds-enrich
      - ./sources:/catalog-sources:ro
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${VDS_ENRICH_MEM_LIMIT:-512m}
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      VDS_SITE_ADDRESS: ${VDS_SITE_ADDRESS:?set VDS_SITE_ADDRESS in .env}
    ports:
      - "${VDS_HTTP_PUBLISH:-80}:80"
      - "${VDS_HTTPS_PUBLISH:-443}:443"
      - "${VDS_HTTPS_PUBLISH:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    logging: *logging

volumes:
  discovery-state:
  enrich-lock:
  postgres-data:
  caddy-data:
  caddy-config:
