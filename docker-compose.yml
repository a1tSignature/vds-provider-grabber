services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${VDS_DB_NAME:-vds}
      POSTGRES_USER: ${VDS_DB_USER:-vds}
      POSTGRES_PASSWORD: ${VDS_DB_PASSWORD:-vds}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VDS_DB_USER:-vds} -d ${VDS_DB_NAME:-vds}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
